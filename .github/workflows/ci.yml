name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compatibility:
    name: Source contract (Node.js ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify source and public contracts
        run: npm run verify:source

  verify:
    needs: compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install PDF validation tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils qpdf

      - name: Install locked dependencies
        run: npm ci

      - name: Verify generated and packed artifacts
        run: npm run verify:artifacts

      - name: Validate GitHub workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml

      - name: Prepare the integration fixture
        run: npm run fixture:prepare

      - name: Exercise the public action contract
        uses: ./
        with:
          command: pipeline
          config: test/fixtures/basic/readme-press.config.mjs
          release-version: v0.0.0-ci.1
          source-commit: ${{ github.sha }}
          render-all: true

      - name: Exercise the Persian RTL example
        uses: ./
        with:
          command: pipeline
          config: test/fixtures/persian/readme-press.config.mjs
          release-version: v0.0.0-ci.1
          source-commit: ${{ github.sha }}
          render-all: true
